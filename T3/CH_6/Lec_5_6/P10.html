<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>


    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-WyOxWvTyr1QaMPfiPJSv76iReVthorl5uWlFtZPyK0IEB0hGzo9y5Bp9mYanr8Bu"
        crossorigin="anonymous"></script>
</head>

<body>
<div class="container mt-3">
    <h2>Button Styles</h2>
    <button class="btn">Basic</button>
    <button class="btn btn-primary">Primary</button>
    <button class="btn btn-secondary">Secondary</button>
    <button class="btn btn-success">Success</button>
    <button class="btn btn-info">Info</button>
    <button class="btn btn-warning">Warning</button>
    <button class="btn btn-danger">Danger</button>
    <button class="btn btn-dark">Dark</button>
    <button class="btn btn-light">Light</button>
    <button class="btn btn-link">Link</button>  
    <!-- Button Using <a> tag -->
        <a href="#" class="btn btn-warning">
            Link Button
        </a>
    <!-- Button Using <input> tag -->
        <input type="button" class="btn btn-info" value="Login">
    <hr>
    <button type="button" class="btn btn-outline-primary">Primary</button>
    <button type="button" class="btn btn-outline-secondary">Secondary</button>
    <button type="button" class="btn btn-outline-success">Success</button>
    <button type="button" class="btn btn-outline-info">Info</button>
    <button type="button" class="btn btn-outline-warning">Warning</button>
    <button type="button" class="btn btn-outline-danger">Danger</button>
    <button type="button" class="btn btn-outline-dark">Dark</button>
    <button type="button" class="btn btn-outline-light text-dark">Light</button>
    <hr>
    <button class="btn btn-sm btn-primary">Small Button</button>
    <button class="btn btn-md btn-warning">Small Button</button>
    <button class="btn btn-lg btn-danger">Small Button</button>
    <hr>
    <button type="button" class="btn btn-outline-primary active">Primary</button>
    <button type="button" class="btn btn-outline-danger disabled">Primary</button>
    <button type="button" class="btn btn-outline-warning" >Primary</button>
    <a href="#" class="btn btn-warning disabled">
        Link Button
    </a> 
  </div>
  
  </body>
  </html>
