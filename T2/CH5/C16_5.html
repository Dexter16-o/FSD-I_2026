<html>
    <head>
        <style>
            div{
                width: 200px;
                height: 200px;
                position: relative;
                animation-name: ex;
                animation-duration: 10s;
                animation-delay: 1s;
                animation-iteration-count: infinite;
                animation-direction: normal;
            }
            @keyframes ex
            {
                0%
                {
                    top: 0px; left: 0px;
                    background-image: linear-gradient(to bottom left,yellow,green,pink);
                }
                25%{
                    top:0px; left: 200px;
                    background-image: radial-gradient(circle,pink,white,blue);
                }
                50%
                {
                    top: 200px;
                    left: 200px;
                    background-image: conic-gradient(pink,white,blue,yellow);
                }
                75%
                {
                    border-radius: 50%;
                    top: 200px; left: 0px;
                    background-image: conic-gradient(red 0deg,red 90deg,yellow 90deg,yellow 180deg,green 180deg,green 270deg,blue 270deg,blue 260deg);
                }
                100%
                {
            
                    top: 0px;
                    left: 0px;
                    background-image: linear-gradient(to bottom left,yellow,green,pink);
                }
            }
        </style>
    </head>
    <div></div>
</html>
