<html>
    <head>
        <style>
            .container{
                height : 200px;
                width: 200px;
                border: 2px solid red; 
                position: relative;
                justify-content: center;
                align-items: center;
                display: flex;
            }
            
            .div1{
                height : 150px;
                width: 150px;
                border-radius: 50%;
                background-image: conic-gradient(red 20deg,red 144deg,blue 144deg,blue 252deg,green 252deg,green 324deg,yellow 324deg,yellow 360deg);
                animation-name: rotate;
                animation-duration: 10s;
                animation-delay: 1s;
                animation-iteration-count: infinite;
                animation-timing-function: ease-in-out;
                border: 2px solid black; 
            }
            
        </style>
    </head>
    <body>
        <h1>CSS Pie Chart using Conic Gradient</h1>
        <div class = "container">
            <div class = "div1"></div>
        </div>
    </body>
</html>
