<!-- CSS Animation -->
<!-- 1.animation-name : @keyframes -->
<!-- 2.animation-duration -->
<!-- 3.animation-delay -->
<!-- 4.animation-timing-function : linear,ease,ease-in(default),ease-out,ease-in-out -->
<!-- 5.animation-iteration-count : max value=infinite -->
<!-- 6.animation-direction : normal(Default),reverse,alternate,alternate-reverse -->

<html>
    <head>
        <style>
            div{
                width: 100px;
                height: 100px;
                background-color: red;
                animation-name: example;
                animation-duration: 4s;
                animation-delay: 1s;
                animation-timing-function: ease-in-out;
                animation-iteration-count: infinite;
                animation-direction: alternate;
            }
            @keyframes example
            {
                from
                {
                    background-color: red;
                }
                to
                {
                    background-color: green;
                }
            }
        </style>
    </head>
    <body>
        <div>
            This is my first animation CSS.
        </div>
    </body>
</html>
