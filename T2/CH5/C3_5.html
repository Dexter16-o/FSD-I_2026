<!-- CSS Positioning -->
<!-- 1.position : static,relative,absolute,fixed,sticky -->
<!-- 2.top -->
<!-- 3.bottom -->
<!-- 4.right -->
<!-- 5.left -->
<!-- 6.z-index -->

<html>  
<head>  
    <style>  
        .container{ 
            margin-top: 50px; 
            height: 800px; 
            border: 1px solid red; 
            position: relative; 
        } 
        .container1{ 
            margin-top: 30px; 
            height: 1000px; 
            border: 2px solid black; 
        } 
        .test { 
            margin-left: 20px; 
            height: 100px; 
            width : 100px; 
            text-align: center; 
            font-size:30px; 
        } 
        /* By default static Position */
        #test1{ 
            background-color: aqua; 
        } 
        /* top,left from test1 position */
        #test2{ 
            background-color: rgb(76, 0, 255); 
            position: relative;  
            top: 50px; 
            left:40px; 
            z-index: 1;  
        } 
        /* position related to nearest position ancetors | top,right from container border*/
        #test3{ 
            background-color: rgb(255, 0, 140); 
            position: absolute; 
            top: 100px; 
            right: 0px;  
        } 
        /* stay fixed in place even when scrolling & it'll positioned from the viewport
            work as back to top button on webiste */
        #test4{ 
            background-color: rgb(208, 255, 0); 
            position: fixed; 
            top: 50px; /* top=50px,right=0 means away 50px from top and 0px away from right from webpage screen */
            right: 0;  
        } 
        /* acts like a normal element until the page is scrolled it sticks to the top of it's conatiner*/
        
        #test5{ 
            background-color: rgb(255, 0, 0); 
            position: sticky; 
            top: 0px;  
        } 
    </style> 
</head>  
<body>  
    <div class="container"> 
        <div class="test" id="test1">1</div> 
        <div class="test" id="test2">2</div> 
        <div class="test" id="test3">3</div> 
        <div class="test" id="test4">4</div> 
        <div class="test" id="test5">5</div> 
    </div> 
    <div class="container1"></div> 
</body>  
</html>
