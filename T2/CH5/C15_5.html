<!-- CSS Gradient -->
<!-- 1.Linear Gradient:
        background-image: 
        Linear-gradient(direction, color-stop1, color-stop2,...)
        to bottom(default),to top,to left,to right,to bottom right,to bottom left,to top left,to top right 
        0deg - to top , 90deg - to right , 180deg - to bottom , 270deg(-90deg) - to left 
     2.Radial Gradient: Ellipse(default),circle
     3.Conic Gradient:  -->

<html>
    <head>
        <style>
            #grad1
            {
                height: 200px;
                width: 200px;
                background-image: linear-gradient(yellow,green,pink);
            }
            /*Evenly Spaced*/
            #grad2
            {
                height: 200px;
                width: 200px;
                background-image: linear-gradient(to bottom left,yellow,green,pink);
            }
            #grad3
            {
                height: 200px;
                width: 200px;
                background-image: linear-gradient(270deg,yellow,green,pink);
            }
            /*Not Evenly spaced*/
            #grad4
            {
                height: 200px;
                width: 200px;
                background-image: linear-gradient(to bottom left,yellow 20%,green 30%,pink 50%);
            }
            /*Radial Gradient*/
            #grad5
            {
                height: 200px;
                width: 300px;
                background-image: radial-gradient(circle,pink,white,blue);
            }
            #grad6
            {
                height: 200px;
                width: 300px;
                background-image: radial-gradient(pink,white,blue);
            }
            /* Conic Gradient */
            #grad7
            {
                height: 200px;
                width: 300px;
                background-image: conic-gradient(pink,white,blue,yellow);
            }
            #grad8
            {
                height: 200px;
                width: 300px;
                background-image: conic-gradient(red 45deg,yellow 90deg,green 180deg,pink 270deg,purple 310deg);
            }
            #grad9
            {
                border-radius: 50%;
                height: 200px;
                width: 200px;
                background-image: conic-gradient(red 0deg,red 90deg,yellow 90deg,yellow 180deg,green 180deg,green 270deg,blue 270deg,blue 260deg);
            }
        </style>
    </head>
    <body>
        <div id="grad1"></div>
        <hr>
        <div id="grad2"></div>
        <hr>
        <div id="grad3"></div>
        <hr>
        <div id="grad4"></div>
        <hr>
        <div id="grad5"></div>
        <hr>
        <div id="grad6"></div>
        <hr>
        <div id="grad7"></div>
        <hr>
        <div id="grad8"></div>
        <hr>
        <div id="grad9"></div>
    </body>
</html>
