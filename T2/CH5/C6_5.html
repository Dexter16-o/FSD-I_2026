<html>
    <head>
        <style>
            .container{
                position: relative;
                border: 20px solid;
            }
            .bottomleft{
                position: absolute;
                bottom: 8px;
                left: 15px;
                font-size: 30px;
            }
            .topright{
                position: absolute;
                top: 8px;
                right: 15px;
                font-size: 30px;
            }
            img{
                width: 100%;
                height: 500px;
                opacity: 0.3;
            }
        </style>
    </head>
    <body>
        <div class="container">
            <img src="trial.jpg">
            <p class="bottomleft"> bottom left </p>
            <p class="topright"> top right </p>
        </div>
    </body>
</html>
