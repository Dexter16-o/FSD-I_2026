<html>
<head>
  <style>
    /* Global CSS Variables */
    :root {
      --section-height: 20vh;
      --section-width: 100%;
      --border-color: red;
      --title-hover-color: red;
      --paragraph-indent: 2cm;
      --animation-time: 0.5s;
    }

    body {
      padding: 0;
      font-family: Arial, sans-serif;
    }

    .section {
      height: var(--section-height);
      width: var(--section-width);
      padding: 20px;
      box-sizing: border-box;
    }

    /* Section hover border animation */
    .section:hover {
      animation-name: borderAnime;
      animation-duration: var(--animation-time);
      animation-fill-mode: forwards;
    }

    @keyframes borderAnime {
      from 
      { 
        border: none; 
      }
      to 
      { 
        border: 2px solid var(--border-color);
      }
    }

    /* Title hover animation */
    .section h2 {
      padding-bottom: 10px;
    }

    .section h2:hover {
      animation-name: titleColor;
      animation-duration: var(--animation-time);
      animation-fill-mode: forwards;
    }

    @keyframes titleColor {
      from 
      {
         color: black; 
      }
      to
      {
         color: var(--title-hover-color); 
      }
    }

    /* Paragraph hover animation */
    .section p {
      padding: 0;
    }

    .section p:hover {
      animation-name: paraAnim;
      animation-duration: var(--animation-time);
      animation-fill-mode: both;
    }

    @keyframes paraAnim {
      from 
      {
        text-indent: 0; 
        text-transform: none; 
      }
      to 
      {
        text-indent: var(--paragraph-indent);
        text-transform: capitalize; 
      }
    }
  </style>
</head>
<body>
  <div class="section">
    <h2>Section One</h2>
    <p>This is the first section paragraph with some sample text.</p>
  </div>

  <div class="section">
    <h2>Section Two</h2>
    <p>This is the second section paragraph with some sample text.</p>
  </div>

  <div class="section">
    <h2>Section Three</h2>
    <p>This is the third section paragraph with some sample text.</p>
  </div>
</body>
</html>
