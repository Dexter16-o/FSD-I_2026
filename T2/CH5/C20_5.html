<html>
    <head>
        <style>
            .div1{
                height : 200px;
                width: 200px;
                position: relative;
                border-radius: 50%;
                background-image: conic-gradient(red 0deg,red 90deg,yellow 90deg,yellow 180deg,green 180deg,green 270deg,blue 270deg,blue 360deg);
                animation-name: rotate;
                animation-duration: 10s;
                animation-delay: 1s;
                animation-iteration-count: infinite;
                animation-timing-function: ease-in-out;
            }
            @keyframes rotate{
                0%{
                    background-image: conic-gradient(red 0deg,red 90deg,yellow 90deg,yellow 180deg,green 180deg,green 270deg,blue 270deg,blue 360deg);
                }
                25%{
                    transform: rotate(90deg);
                }
                50%{
                    transform: rotate(180deg);
                }
                75%{
                    transform: rotate(270deg);
                }
                100%{
                    background-image: conic-gradient(red 0deg,red 90deg,yellow 90deg,yellow 180deg,green 180deg,green 270deg,blue 270deg,blue 360deg);
                }
            }
        </style>
    </head>
    <body>
        <div class = "div1"></div>
    </body>
</html>
