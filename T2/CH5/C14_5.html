<html></html>
    <head>
        <style>
            div{
                width: 100px;
                height: 100px;
                background-color: pink;
                position: relative;
                animation-name: ex;
                animation-duration: 10s;
                animation-delay: 1s;
                animation-iteration-count: infinite;
                animation-direction: alternate;
            }
            @keyframes ex
            {
                0%
                {
                    top: 0px; left: 0px;
                    background-color: palegreen;
                }
                25%{
                    border-radius: 50%;
                    top:0px; left: 200px;
                    background-color: yellow;
                }
                50%
                {
                    border-radius: 0%;
                    top: 200px;
                    left: 200px;
                }
                75%
                {
                    height: 150px;
                    width: 70px;
                    top: 200px; left: 0px;
                    background-color: blue;
                }
                100%
                {
                    top: 0px;
                    left: 0px;
                    background-color: red;
                }
            }
        </style>
    </head>
    <body>
        <div>
            This is my first position animation CSS.
        </div>
    </body>
</html>
