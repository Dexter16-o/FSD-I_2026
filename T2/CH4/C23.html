<!-- border-top: 3px dashed blue -->
<!-- 6. border-right -->
<!-- border-right: 2px dotted green -->
<!-- 7. border-bottom -->

<!-- 8. border-left -->

<!-- 9. border-radius -->
<!-- border-radius: 10px -->

<html>
    <head>
    </head>
    <body>
        <p style="border-style: double;
                  border-color: red;
                  border-width: 2px;">
                  same output Without Shorthand
        </p>
        <p style="border: 2px double red;
                  border-radius: 10px;">
            same output With Shorthand
        </p>
        <p style="border-top: 3px dashed red;">
            Only top border
        </p>
        <p style="border-bottom: 3px dashed red;">
            Only bottom border
        </p>
        <p style="border-right: 3px dashed red;">
            Only right border
        </p>
        <p style="border-left: 3px dashed red;">
            Only left border
        </p>
    </body>
</html>
