<!-- Priority order: Inline > Id > class > Element -->

<html>
    <head>
        <style>
            h1{color:blue}
            #Main{color:green}
            .title{color:red}
        </style>
    </head>
    <body>
        <h1 style="color:pink"
            class="title"
            id="Main">
        which color will win this fight?</h1>
    </body>
</html>
