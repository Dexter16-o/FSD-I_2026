<!-- 6. letter-spacing -->
<!-- 7. Word-spacing -->
<!-- letter/word-spacing: length (normal,px,em) -->

<html>
    <head>
        <style>
            .ls1{
                letter-spacing: 5px;
            }
            .ls2{
                letter-spacing: -2px;
            }
            .ws1{
                word-spacing: 10px;
            }
            .ws2{
                word-spacing: -6px;
            }
        </style>
    </head>
    <body>
        <p class="ls1">
            See the magic in every little moments!
        </p>
        <p class="ls2">
            See the
            <span style="letter-spacing: normal;" >
                magic in every
            </span>
            little moments!
        </p>
        <p class="ws1">
            See the magic in every little moments!
        </p>
        <p class="ws2">
            See the
            <span style="word-spacing: normal;" >
                magic in every
            </span>
            every little moments!
        </p>
    </body>
</html>
