<!-- 4.background-clip: border-box(default),padding box,content box -->
 
<html>
    <head>
        <style>
            .box1{
                border: 10px dotted green;
                width: 400px;
                height: 200px;
                padding: 50px;
                background-image: url("flower.jfif");
                background-color: lightgreen;
                background-clip: border-box;
                text-align: center;
                font-size: 20px;
            }
            .box2{
                border: 10px dotted red;
                width: 400px;
                height: 200px;
                padding: 50px;
                background-image: url("flower.jfif");
                background-color: lightgreen;
                background-clip: padding-box;
                text-align: center;
                font-size: 20px;
            }
            .box3{
                border: 10px dotted yellow;
                width: 400px;
                height: 200px;
                padding: 50px;
                background-image: url("flower.jfif");
                background-color: lightgreen;
                background-clip: content-box;
                text-align: center;
                font-size: 20px;
            }
        </style>
    </head>
    <body>
        <div class="box1">This shows a border box</div>
        <hr>
        <div class="box2">This shows a padding box</div>
        <hr>
        <div class="box3">This shows a content box</div>
    </body>
</html>
