<!-- 7.background-position -->
<!-- left-top(default),center,top/bottom/left/right -->
<!-- shows a specific part of a large image -->

<html>
    <head>
        <style>
            body{
                background-image: url("flower.jfif");
                background-repeat: no-repeat;
                background-position: center;
            }
        </style>
    </head>
    <body>
        <h1>This is center image</h1>
    </body>
</html>
