<!--Child Selector-->
<!--Must be a direct child of previous tag-->
<html>
    <head>
        <style>
            ul>li>b{
                color:blue;
            }
        </style>
    </head>
    <body>
        <ul>
            <li>
                <b>Mango</b>
            </li>
        </ul>
    </body>
</html>
