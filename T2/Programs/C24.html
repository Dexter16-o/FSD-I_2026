<!-- CSS Border-properties -->

<html>
    <head>
        <style>
            p.one{
                border-style: solid;
                border-color: red;
                border-width: 5px;
            }
            p.two{
                border-style: solid double;
                border-color: green red;
                border-width: 2px;
            }
            p.three{
                border-style: solid dashed double;
                border-color: red green blue;
                border-width: 3px;
            }
            p.four{
                border-style: solid dashed double dotted;
                border-color: red blue green yellow;
                border-width: 5px;
            }
        </style>
    </head>
    <body>
        <p class="one">Good Morning</p>
        <p class="Two">Good Morning</p>
        <p class="Three">Good Morning</p>
        <p class="Four">Good Morning</p>
    </body>
</html>
