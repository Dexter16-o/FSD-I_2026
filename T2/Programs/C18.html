<!-- 4. text-transform -->
 <!-- None,Lowercase,Uppercase,capitalize -->

<html>
    <head>
        <style>
            .case1{
                text-transform: uppercase;
            }
            .case2{
                text-transform: lowercase;
            }
            .case3{
                text-transform: capitalize;
            }
        </style>
    </head>
    <body>
        <p class="case1">
            Today is a good day.
        </p>
        <p class="case2">
            Today is a good day.
        </p>
        <p class="case3">
            Today is a good day.
        </p>
        <p class="case1">
            Today is a good day.
            <span style="text-transform: none;">
                This is Normal to someone.
            </span>
            It's depend
        </p>
    </body>
</html>
